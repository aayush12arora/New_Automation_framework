name: PR Tests

# Runs the full test suite whenever a pull request is opened or updated.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:   # also allow running it manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Run tests (headless)
        env:
          # Add QTEST_API_TOKEN under Settings > Secrets and variables > Actions.
          # Results upload is skipped (harmlessly) if it or qtestTestCycle is unset.
          QTEST_API_TOKEN: ${{ secrets.QTEST_API_TOKEN }}
        run: mvn -B --no-transfer-progress clean test -Dheadless=true

      - name: Upload reports
        if: always()   # keep the report even when tests fail
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-pr-${{ github.run_id }}
          path: target/extent-report/
          if-no-files-found: ignore
