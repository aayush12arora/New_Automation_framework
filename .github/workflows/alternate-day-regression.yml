name: Alternate-Day Regression Tests

# Runs the "regression" group on alternate days. Cron cannot express a true
# every-48-hours schedule, so this fires on odd days of the month (1,3,5,...,31).
# Note: the gap resets at month boundaries (the 31st and the 1st are consecutive).
# Scheduled workflows run on the default branch.
on:
  schedule:
    - cron: '0 3 */2 * *'   # 03:00 UTC on odd days of the month
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Run regression tests (headless)
        env:
          QTEST_API_TOKEN: ${{ secrets.QTEST_API_TOKEN }}
        run: mvn -B --no-transfer-progress clean test -Dgroups=regression -Dheadless=true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-regression-${{ github.run_id }}
          path: target/extent-report/
          if-no-files-found: ignore
