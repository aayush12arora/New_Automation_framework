name: Alternate-Day Regression Tests

# Runs the "regression" group on alternate days. Cron cannot express a true
# every-48-hours schedule, so this fires on odd days of the month (1,3,5,...,31).
# Note: the gap resets at month boundaries (the 31st and the 1st are consecutive).
# Scheduled workflows run on the default branch.
on:
  schedule:
    - cron: '0 3 */2 * *'   # 03:00 UTC on odd days of the month
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      # Results e-mail is sent only when the SMTP_PASSWORD secret exists (see README)
      SMTP_CONFIGURED: ${{ secrets.SMTP_PASSWORD != '' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run regression tests (headless)
        env:
          QTEST_API_TOKEN: ${{ secrets.QTEST_API_TOKEN }}
          # Store under test: set TORSAVO_URL (and TORSAVO_API_URL if the API host is not
          # api.<domain>) under Settings > Secrets and variables > Actions > Variables.
          # Chrome is preinstalled on ubuntu-latest runners.
        run: mvn -B --no-transfer-progress clean test -Dgroups=regression -Dheadless=true -Dbrowser=chrome -Durl=${{ vars.TORSAVO_URL }} -DapiUrl=${{ vars.TORSAVO_API_URL }}

      - name: Summarise results for e-mail
        id: summary
        if: always()
        run: |
          python3 .github/scripts/test_summary.py "Regression" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ vars.TORSAVO_URL }}"
          # Attach the report only if it fits Gmail's 25 MB limit (base64 adds ~33%);
          # it is always available under the run's Artifacts.
          if [ -d target/extent-report ]; then
            (cd target && zip -qr extent-report.zip extent-report)
            if [ "$(stat -c%s target/extent-report.zip)" -lt 18874368 ]; then
              echo "attachment=target/extent-report.zip" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: E-mail results
        if: always() && env.SMTP_CONFIGURED == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          # Google Workspace SMTP by default; override with SMTP_SERVER / SMTP_PORT variables
          server_address: ${{ vars.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ vars.SMTP_PORT || '465' }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: Torsavo QA <${{ vars.REPORT_EMAIL_FROM || 'info@torsavo.com' }}>
          to: ${{ vars.REPORT_EMAIL_TO || 'aayush12arora@gmail.com' }}
          subject: ${{ steps.summary.outputs.subject || format('[Torsavo Regression] run {0} finished', github.run_number) }}
          html_body: file://target/email-body.html
          attachments: ${{ steps.summary.outputs.attachment }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-regression-${{ github.run_id }}
          path: target/extent-report/
          if-no-files-found: ignore
