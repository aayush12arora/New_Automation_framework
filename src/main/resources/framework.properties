browser=firefox
headless=false
url=https://example.com
implicitWait=10
explicitWait=20
screenshotOnEachStep=true

# Retry failed tests: toggle + max attempts (applied automatically to every @Test)
retryEnabled=true
retryCount=2

# Test data source: json | excel (file named after the test; keys/headers match CustomerData fields)
dataSource=json

# Database (SQL) — drop your JDBC driver on the classpath and set these
db.url=jdbc:mysql://localhost:3306/testdb
db.username=root
db.password=root

# qTest upload: runs automatically at the end of every "mvn test", no separate
# command needed. The API token is NOT set here — export it as an environment
# variable instead: QTEST_API_TOKEN=<your-token>
qtestEnabled=true
qtestDomain=aayushhashedin.qtestnet.com
qtestProjectId=29695
# Parent Test Cycle (PID like "TC-1" or numeric ID) the Test Runs are created under.
# REQUIRED by the auto-test-logs API — find/create one under the Test Execution tab.
qtestTestCycle=

# API testing: mock (WireMock, runs anywhere) | live (real server + real token)
api.mode=mock
api.baseUrl=https://agentic-uat.eng.deloitte.com
api.mockPort=8089
# QE_API_TOKEN is an ENVIRONMENT VARIABLE (never a property) — needed only in live mode
