browser=firefox
headless=false
url=https://example.com
implicitWait=10
explicitWait=20
screenshotOnEachStep=true

# Retry failed tests: toggle + max attempts (applied automatically to every @Test)
retryEnabled=true
retryCount=2

# Test data source: json | excel (file named after the test; keys/headers match CustomerData fields)
dataSource=json

# Database (SQL) — drop your JDBC driver on the classpath and set these
db.url=jdbc:mysql://localhost:3306/testdb
db.username=root
db.password=root

# qTest upload: runs automatically at the end of every "mvn test", no separate
# command needed. The API token is NOT set here — export it as an environment
# variable instead: QTEST_API_TOKEN=<your-token>
qtestEnabled=false
qtestDomain=yourcompany.qtestnet.com
qtestProjectId=12345
