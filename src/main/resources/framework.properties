# =====================================================================
#  Torsavo E2E — the two settings you normally change
# =====================================================================
# Storefront under test (no trailing slash needed)
url=http://dev.torsavo.com
# firefox | chrome | edge
browser=chrome

# Backend REST API. Leave blank to derive it from url:
#   localhost  -> http://localhost:8000/api
#   any other  -> https://api.<domain>/api   (set it explicitly if yours differs)
apiUrl=https://dev.api.torsavo.com/api

# =====================================================================
#  Browser & waits
# =====================================================================
headless=false
windowSize=1920x1080
# 0 = rely on explicit waits only (mixing implicit + explicit waits makes absence checks slow)
implicitWait=0
explicitWait=25
pageLoadTimeout=60
# true = screenshot every step into the Extent report (large reports for 100 tests)
screenshotOnEachStep=false

# Retry failed tests: toggle + max attempts (applied automatically to every @Test)
retryEnabled=true
retryCount=1

# =====================================================================
#  Torsavo test data
# =====================================================================
# true  = tests may register throwaway customers and place (unpaid) orders — use on local/staging.
# false = production-safe: those tests are skipped, signed-in tests use testUserEmail below.
createTestData=true
# Domain for throwaway customer e-mails (registration sends no e-mail)
testEmailDomain=example.com
# Optional fixed customer, used only when createTestData=false
testUserEmail=
testUserPassword=
# Admin account (dev). The two admin-dashboard tests are skipped when blank.
# For other environments override per run instead of committing: -DadminEmail=... -DadminPassword=...
adminEmail=admin@ecom.com
adminPassword=admin1234

# Store business rules the tests check (keep in sync with the store's env)
storeName=Torsavo
freeShippingMinItems=2
gstHomeState=Uttar Pradesh

# Test data source: json | excel (file named after the test; keys/headers match CustomerData fields)
dataSource=json

# Database (SQL) — drop your JDBC driver on the classpath and set these
db.url=jdbc:mysql://localhost:3306/testdb
db.username=root
db.password=root

# qTest upload: runs automatically at the end of every "mvn test", no separate
# command needed. The API token is NOT set here — export it as an environment
# variable instead: QTEST_API_TOKEN=<your-token>
qtestEnabled=true
qtestDomain=aayushhashedin.qtestnet.com
qtestProjectId=29695
# Parent Test Cycle (PID like "TC-1" or numeric ID) the Test Runs are created under.
# REQUIRED by the auto-test-logs API — find/create one under the Test Execution tab.
qtestTestCycle=
